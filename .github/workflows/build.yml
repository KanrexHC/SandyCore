name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
    - name: Install system dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y ant openjdk-17-jdk wget unzip
    
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer setuptools cython

    - name: Build APK
      run: |
        buildozer init
        sed -i 's/^# main.entrypoint = main.py/main.entrypoint = app.main/' buildozer.spec
        sed -i 's/^# requirements = python3/requirements = python3, fastapi, uvicorn, google-generativeai, python-dotenv, websockets, cython/' buildozer.spec
        sed -i 's/^# android.permissions = /android.permissions = RECORD_AUDIO, INTERNET, ACCESS_NETWORK_STATE/' buildozer.spec
        sed -i 's/^# package.name = org.test.hello/package.name = com.tuusuario.sandyia/' buildozer.spec
        sed -i 's/^# version = 0.1/version = 1.0.0/' buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
echo "android.build_tools_version = '33.0.2'" >> buildozer.spec
echo "android.sdk_version = 33" >> buildozer.spec
echo "android.ndk_version = '25b'" >> buildozer.spec

        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SandyCore-APK
        path: bin/*.apk
        
